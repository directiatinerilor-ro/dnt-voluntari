<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8"><title>DNT Volunteer Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0a1020;--sb:#0e1730;--card:#121c36;--b:#233153;--t:#e8eefb;--m:#8d9cbc;--a:#2f6bff;--a2:#6f9bff;--ok:#2fbf8a;--wr:#f0b429;--er:#ef5b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{display:flex;min-height:100vh}
nav{width:236px;background:var(--sb);border-right:1px solid var(--b);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo{background:#fff;border-radius:10px;padding:8px;margin-bottom:6px}.logo img{width:100%;display:block}
.brand{font-weight:700;font-size:15px;margin:10px 4px 2px}.slg{color:var(--m);font-size:11.5px;margin:0 4px 16px}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--m);text-decoration:none;margin:2px 0;border-left:3px solid transparent}
nav a:hover{color:var(--t);background:#16224280}nav a.on{color:#fff;background:#1b2b55;border-left-color:var(--a2)}
main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1300px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}.sub{color:var(--m);margin:0 0 18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px}
.st b{display:block;font-size:26px;letter-spacing:-.5px}.st span{color:var(--m);font-size:12.5px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}.bar i{flex:0 0 120px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal}
.bar u{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--a2));text-decoration:none;min-width:2px}.bar em{font-style:normal;color:var(--t)}
.empty{color:var(--m);padding:14px;border:1px dashed var(--b);border-radius:10px;text-align:center}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--b);vertical-align:middle}
th{color:var(--m);font-weight:600;font-size:12.5px}.tw{overflow-x:auto}
input,select,textarea{background:#0c1530;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--a2);outline-offset:1px}
label{display:block;font-size:12.5px;color:var(--m);margin-bottom:3px}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.f .w{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--t)}.chk input{width:auto;margin-top:3px}
button,.btn{background:var(--a);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#4a7fff}button.g{background:#1b2b55}button.d{background:#5a2330}button.s{padding:4px 9px;font-size:12px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar2>*{width:auto;flex:1 1 150px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#1b2b55}
.Activ,.Aprobat,.Aprobată,.Activă,.Validat{background:#10382e;color:var(--ok)}.Suspendat,.Respins,.Retras{background:#40202a;color:var(--er)}.Nouă,.Candidat,.Nevalidat,.Completări{background:#3f3413;color:var(--wr)}
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;position:relative;padding-top:18px;width:100%}
.row:before{content:"";position:absolute;top:0;left:50%;height:18px;border-left:2px solid var(--b)}
.nd{width:190px;background:var(--card);border:1px solid var(--b);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.nd:hover{border-color:var(--a2)}.nd small{display:block;color:var(--m);font-size:11.5px;min-height:30px}
.nd .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--a),#1b2b55);display:grid;place-items:center;margin:0 auto 6px;font-weight:700}
.nd.vac{border-style:dashed;background:transparent}.nd.vac .av{background:#16224a;color:var(--m)}.nd.vac b{color:var(--wr)}
.grp{width:100%;margin-top:22px}.grp>h2{text-align:center;color:var(--m);font-size:13px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20}
.mb{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.top{display:none}
@media(max-width:820px){#app{display:block}nav{position:static;width:auto;height:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}.logo{width:120px}.brand,.slg{display:none}nav a{padding:6px 10px}main{padding:16px}}
@media print{body *{visibility:hidden}.mb,.mb *{visibility:visible}.mb{position:absolute;left:0;top:0;background:#fff;color:#000;border:0}.noprint{display:none!important}}
@media(prefers-reduced-motion:no-preference){.card,.nd{transition:border-color .15s}}

:root{--bg:#070b1a;--card:rgba(255,255,255,.06);--b:rgba(255,255,255,.13);--sb:rgba(255,255,255,.04)}
body{background:#070b1a}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(95px);opacity:.5;pointer-events:none}
body:before{width:540px;height:540px;background:#2f6bff;top:-150px;left:-120px;animation:fl 18s ease-in-out infinite alternate}
body:after{width:500px;height:500px;background:#8b5cf6;bottom:-170px;right:-110px;animation:fl 23s ease-in-out infinite alternate-reverse}
@keyframes fl{to{transform:translate(90px,70px) scale(1.15)}}
nav{background:rgba(255,255,255,.045);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.card,.nd,.mb{position:relative;overflow:hidden;background:var(--card);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--b);box-shadow:0 10px 34px #0005,inset 0 1px 0 #ffffff22}
.card:after,.nd:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--x,50%) var(--y,-50%),#7fa6ff2e,transparent 60%)}
.card:hover:after,.nd:hover:after{opacity:1}
.card:hover,.nd:hover{transform:translateY(-2px);border-color:#7fa6ff80;box-shadow:0 14px 44px #2f6bff33,inset 0 1px 0 #ffffff30}
.card,.nd{transition:transform .2s,border-color .2s,box-shadow .2s}
.nd.vac{background:transparent;backdrop-filter:none}
h1{background:linear-gradient(90deg,#fff,#9db9ff 60%,#b9a5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.st b{background:linear-gradient(180deg,#fff,#8fb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
nav a{transition:all .2s}nav a.on{background:linear-gradient(90deg,#2f6bff55,#7c5cff22);box-shadow:inset 0 0 0 1px #ffffff1f}
input,select,textarea{background:rgba(255,255,255,.06);border-color:var(--b);transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{background:rgba(255,255,255,.1);border-color:#7fa6ff}
button{background:linear-gradient(135deg,#2f6bff,#7c5cff);box-shadow:0 4px 18px #2f6bff55;transition:transform .15s,box-shadow .2s}
button:hover{background:linear-gradient(135deg,#4a7fff,#9174ff);transform:translateY(-1px);box-shadow:0 8px 24px #2f6bff66}
button.g{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px var(--b)}button.d{background:rgba(239,91,107,.3);box-shadow:inset 0 0 0 1px #ef5b6b66}
.tag{background:rgba(255,255,255,.1);backdrop-filter:blur(6px)}
.modal{backdrop-filter:blur(8px);background:#050a1c99}.mb{background:rgba(18,28,56,.72)}
tr{transition:background .15s}tr:hover td{background:rgba(255,255,255,.04)}
main{animation:in .5s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.bar u{transform-origin:left;animation:gr .9s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 12px #5b8cff88}@keyframes gr{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

const tag=s=>`<span class="tag ${esc(s).replace(/ /g,"")}">${esc(s)}</span>`;
const cnt=a=>a.reduce((o,x)=>(x&&(o[x]=(o[x]||0)+1),o),{});
function bars(o){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,10);if(!e.length)return'<div class="empty">Nu există încă date.</div>';const m=Math.max(...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="bar"><i title="${esc(k)}">${esc(k)}</i><u style="width:${v/m*60}%"></u><em>${v}</em></div>`).join("")}
const VIEWS={dash:"Dashboard",vol:"Registrul voluntarilor",apps:"Cereri de înscriere",org:"Structură națională",br:"Filiale",dep:"Departamente",hrs:"Ore de voluntariat",aud:"Audit log"};
function nav(){const v=cur();$("#nav").innerHTML=`<div class="logo"><img src="${LOGO}" alt="DNT"></div><div class="brand">DNT VOLUNTEER HUB</div><div class="slg">“Every Volunteer. Every Branch. One Organization.”</div>`+Object.entries(visV()).map(([k,n])=>`<a href="#${k}" class="${k===v?"on":""}">${n}</a>`).join("")+`<a href="#" onclick="out();return false">Ieșire (${esc(ME.nume||ME.email)})</a>`}
const visV=()=>!FULL.includes(ME.role)?{me:"Contul meu",taskme:"Task-urile mele",oreme:"Orele mele"}:{...VIEWS,taskuri:"Taskuri voluntari",orevol:"Ore trimise de voluntari",users:"Conturi și acces"};
const cur=()=>{const h=(location.hash||"#dash").slice(1),a=visV();return a[h]?h:Object.keys(a)[0]};
function go(){if(!ME)return;nav();$("#main").innerHTML=R[cur()]();window.scrollTo(0,0)}
addEventListener("hashchange",go);
const R={};
R.dash=()=>{const V=S.vol,c=cnt(V.map(v=>v.status)),hv=S.hrs.filter(h=>h.ok),tot=hv.reduce((s,h)=>s+h.h,0),BE=S.board.filter(x=>x.g==="BE"&&x.n).length;
const mo={};V.forEach(v=>{const k=(v.reg||"").slice(0,7);k&&(mo[k]=(mo[k]||0)+1)});
const st=[["Voluntari totali",V.length],["Activi",c.Activ||0],["Inactivi",c.Inactiv||0],["Suspendați",c.Suspendat||0],["Cereri noi",S.apps.filter(a=>a.s==="Nouă").length],["Filiale",S.br.length],["Filiale active",S.br.filter(b=>b.s==="Activă").length],["Filiale în înființare",S.br.filter(b=>["În pregătire","Cerere de înființare","În analiză"].includes(b.s)).length],["Departamente",DEPS.length],["Coordonatori",V.filter(v=>/coordonator/i.test(v.fn)).length],["Membri Birou Executiv",BE],["Proiecte (din ore)",new Set(S.hrs.map(h=>h.p)).size],["Activități înregistrate",S.hrs.length],["Ore validate",tot]];
return`<h1>Dashboard național</h1><p class="sub">Toate cifrele sunt calculate din datele stocate în sistem.</p><div class="grid">${st.map(([k,v])=>`<div class="card st"><b>${v}</b><span>${k}</span></div>`).join("")}</div>
<div class="two"><div class="card"><h2>Voluntari pe județe</h2>${bars(cnt(V.map(v=>v.judet)))}</div><div class="card"><h2>Voluntari pe departamente</h2>${bars(cnt(V.map(v=>v.dept)))}</div>
<div class="card"><h2>Voluntari pe filiale</h2>${bars(cnt(V.map(v=>v.branch)))}</div><div class="card"><h2>Înscrieri lunare</h2>${bars(mo)}</div>
<div class="card"><h2>Ore validate pe filiale</h2>${bars(hv.reduce((o,h)=>(o[h.br||"—"]=(o[h.br||"—"]||0)+h.h,o),{}))}</div>
<div class="card"><h2>Activitate recentă</h2>${S.aud.slice(0,6).map(a=>`<div style="padding:4px 0;border-bottom:1px solid var(--b)">${esc(a.a)}<br><small style="color:var(--m)">${new Date(a.t).toLocaleString("ro-RO")}</small></div>`).join("")||'<div class="empty">Nicio acțiune încă.</div>'}</div></div>`};
let vf={q:"",st:"",dp:"",br:""};
R.vol=()=>{const L=S.vol.filter(v=>(!vf.q||(v.nume+" "+v.prenume+" "+v.id).toLowerCase().includes(vf.q.toLowerCase()))&&(!vf.st||v.status===vf.st)&&(!vf.dp||v.dept===vf.dp)&&(!vf.br||v.branch===vf.br));
return`<h1>Registrul național al voluntarilor</h1><p class="sub">${S.vol.length} înregistrați · fișe individuale cu istoric complet.</p>
<div class="bar2 noprint"><input placeholder="Caută după nume sau ID" value="${esc(vf.q)}" oninput="vf.q=this.value;fv()"><select onchange="vf.st=this.value;fv()"><option value="">Orice status</option>${opts(ST,vf.st)}</select><select onchange="vf.dp=this.value;fv()"><option value="">Orice departament</option>${opts(DEPS,vf.dp)}</select><select onchange="vf.br=this.value;fv()"><option value="">Orice filială</option>${opts(S.br.map(b=>b.name),vf.br)}</select><button onclick="vForm()">+ Voluntar</button><button class="g" onclick="exp()">Export Excel</button></div><div class="card tw" id="vt">${vt(L)}</div>`};
const vt=L=>L.length?`<table><tr><th>ID</th><th>Nume</th><th>Județ</th><th>Filiala</th><th>Departament</th><th>Funcție</th><th>Status</th><th></th></tr>${L.map(v=>`<tr><td>${v.id}</td><td>${esc(v.nume)} ${esc(v.prenume)}</td><td>${esc(v.judet)}</td><td>${esc(v.branch)}</td><td>${esc(v.dept)}</td><td>${esc(v.fn)}</td><td>${tag(v.status)}</td><td><button class="s g" onclick="fisa('${v.id}')">Fișă</button></td></tr>`).join("")}</table>`:'<div class="empty">Niciun voluntar. Adaugă unul sau aprobă o cerere de înscriere.</div>';
function fv(){const t=R.vol();const d=document.createElement("div");d.innerHTML=t;$("#vt").innerHTML=d.querySelector("#vt").innerHTML}
function addVol(o,note){const id="DNT-V-"+String(++S.q.v).padStart(4,"0");const v={id,nr:"RV-"+new Date().getFullYear()+"-"+String(S.q.v).padStart(4,"0"),nume:o.nume,prenume:o.prenume,email:o.email||"",tel:o.tel||"",judet:o.judet||"",loc:o.loc||"",branch:o.branch||"",dept:o.dept||"",fn:o.fn||"Voluntar",nivel:o.nivel||"local",coord:o.coord||"",status:o.status||"Activ",reg:today(),start:today(),h:[{d:today(),t:note||"Înscriere în registru"}]};S.vol.push(v);log(`A adăugat voluntarul ${id} (${v.nume} ${v.prenume})`);return v}
function modal(h){$("#mod").innerHTML=`<div class="modal" onclick="if(event.target===this)cm()"><div class="mb">${h}</div></div>`}
const cm=()=>{$("#mod").innerHTML=""};
function vForm(){modal(`<h2>Voluntar nou</h2><form onsubmit="svVol(event)"><div class="f"><div><label>Nume</label><input name="nume" required></div><div><label>Prenume</label><input name="prenume" required></div><div><label>E-mail</label><input name="email" type="email"></div><div><label>Telefon</label><input name="tel"></div><div><label>Județ</label><input name="judet" list="jl"></div><div><label>Localitate</label><input name="loc"></div><div><label>Filiala</label><select name="branch"><option value="">—</option>${opts(S.br.map(b=>b.name))}</select></div><div><label>Departament</label><select name="dept"><option value="">—</option>${opts(DEPS)}</select></div><div><label>Funcție</label><input name="fn" value="Voluntar"></div><div><label>Coordonator direct</label><input name="coord"></div><div><label>Nivel</label><select name="nivel"><option>local</option><option>județean</option><option>național</option></select></div><div><label>Status</label><select name="status">${opts(ST,"Activ")}</select></div></div><datalist id="jl">${JUD.map(j=>`<option>${j}`).join("")}</datalist><p><button>Salvează</button> <button type="button" class="g" onclick="cm()">Anulează</button></p></form>`)}
function svVol(e){addVol(fd(e));cm();go()}
function fisa(id){const v=S.vol.find(x=>x.id===id);modal(`<h2>Fișă voluntar · ${v.id}</h2><p><b>${esc(v.nume)} ${esc(v.prenume)}</b><br>Nr. înregistrare: ${v.nr}<br>${esc(v.email)} ${esc(v.tel)}<br>${esc(v.loc)}, ${esc(v.judet)}<br>Filiala: ${esc(v.branch)||"—"} · Departament: ${esc(v.dept)||"—"} · Funcție: ${esc(v.fn)} · Nivel: ${v.nivel}<br>Înscris: ${v.reg} · Status: ${v.status}</p><p>Ore validate: <b>${S.hrs.filter(h=>h.vid===id&&h.ok).reduce((s,h)=>s+h.h,0)}</b></p><h2>Istoric</h2>${v.h.map(x=>`<div>${x.d} — ${esc(x.t)}</div>`).join("")}
<div class="noprint" style="margin-top:12px"><div class="f"><div><label>Status nou</label><select id="ns">${opts(ST,v.status)}</select></div><div><label>Departament nou</label><select id="nd"><option value="">—</option>${opts(DEPS,v.dept)}</select></div><div><label>Filială nouă</label><select id="nb"><option value="">—</option>${opts(S.br.map(b=>b.name),v.branch)}</select></div><div><label>Funcție</label><input id="nf" value="${esc(v.fn)}"></div></div><p><button onclick="upd('${id}')">Aplică modificările</button> <button class="g" onclick="print()">Printează / PDF</button> <button class="g" onclick="cm()">Închide</button></p></div>`)}
function upd(id){const v=S.vol.find(x=>x.id===id),n={status:$("#ns").value,dept:$("#nd").value,branch:$("#nb").value,fn:$("#nf").value},L={status:"Schimbare status",dept:"Schimbare departament",branch:"Schimbare filială",fn:"Schimbare funcție"};
for(const k in n)if(n[k]!==v[k]){v.h.push({d:today(),t:`${L[k]}: ${v[k]||"—"} → ${n[k]||"—"}`});log(`${L[k]} la ${id}: ${v[k]||"—"} → ${n[k]||"—"}`);v[k]=n[k]}save();cm();go()}
function exp(){const c=["id","nr","nume","prenume","email","tel","judet","loc","branch","dept","fn","status","reg"],r=[c.join(";")].concat(S.vol.map(v=>c.map(k=>`"${String(v[k]).replace(/"/g,'""')}"`).join(";")));
try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+r.join("\n")],{type:"text/csv"}));a.download="voluntari_DNT.csv";a.click()}catch(e){alert("Exportul nu este disponibil în acest mediu.")}}
R.apps=()=>`<h1>Cereri de înscriere</h1><p class="sub">Formular public + flux de verificare Resurse Umane.</p><div class="card" style="margin-bottom:14px"><h2>Formular național de înscriere</h2><form onsubmit="svApp(event)"><div class="f"><div><label>Nume</label><input name="nume" required></div><div><label>Prenume</label><input name="prenume" required></div><div><label>E-mail</label><input name="email" type="email" required></div><div><label>Telefon</label><input name="tel" required></div><div><label>Județ</label><input name="judet" list="jl" required></div><div><label>Localitate</label><input name="loc"></div><div><label>Categorie de vârstă</label><select name="age" onchange="document.getElementById('par').style.display=this.value==='Sub 18 ani'?'flex':'none'"><option>Sub 18 ani</option><option selected>18–25 ani</option><option>26–35 ani</option></select></div><div><label>Instituție de învățământ (opțional)</label><input name="inst"></div><div><label>Departament dorit</label><select name="dept">${opts(DEPS)}</select></div><div><label>Filiala dorită</label><select name="branch"><option value="">Nealocată încă</option>${opts(S.br.map(b=>b.name))}</select></div><div class="w"><label>Experiență anterioară și domenii de interes</label><textarea name="exp" rows="2"></textarea></div><div class="w"><label>Motivația înscrierii</label><textarea name="mot" rows="2" required></textarea></div><div class="w"><label>Disponibilitate</label><input name="disp"></div>
<label class="chk w" id="par" style="display:none"><input type="checkbox" name="par"> Am acordul scris al părintelui sau tutorelui legal (obligatoriu pentru minori)</label><datalist id="jl">${JUD.map(j=>`<option>${j}`).join("")}</datalist>
<label class="chk w"><input type="checkbox" name="gdpr" required> Sunt de acord cu prelucrarea datelor personale în scopul evidenței voluntarilor DNT, conform GDPR, și am citit informarea.</label></div><p><button>Trimite cererea</button></p></form></div>
<div class="card tw"><h2>Cereri în sistem</h2>${S.apps.length?`<table><tr><th>Nr.</th><th>Candidat</th><th>Județ</th><th>Departament</th><th>Status</th><th></th></tr>${S.apps.map(a=>`<tr><td>${a.id}</td><td>${esc(a.nume)} ${esc(a.prenume)}<br><small style="color:var(--m)">${esc(a.age)}</small></td><td>${esc(a.judet)}</td><td>${esc(a.dept)}</td><td>${tag(a.s)}</td><td>${["Nouă","Completări"].includes(a.s)?`<button class="s" onclick="decide('${a.id}','Aprobată')">Aprobă</button> <button class="s g" onclick="decide('${a.id}','Completări')">Cere completări</button> <button class="s d" onclick="decide('${a.id}','Respinsă')">Respinge</button>`:""}</td></tr>`).join("")}</table>`:'<div class="empty">Nicio cerere primită.</div>'}</div>`;
function svApp(e){const o=fd(e);if(o.age==="Sub 18 ani"&&!o.par){alert("Pentru minori este necesar acordul părintelui sau tutorelui.");return}o.id="CR-"+new Date().getFullYear()+"-"+String(++S.q.a).padStart(4,"0");o.s="Nouă";o.date=today();S.apps.unshift(o);log("Cerere nouă de înscriere "+o.id);alert("Cererea a fost înregistrată cu numărul "+o.id);go()}
function decide(id,s){const a=S.apps.find(x=>x.id===id);a.s=s;if(s==="Aprobată"){const v=addVol({...a,fn:"Voluntar",status:"Activ"},"Cerere "+id+" aprobată");a.vid=v.id;log(`Cerere ${id} aprobată; profil ${v.id}`)}else log(`Cerere ${id}: ${s}`);save();go()}
R.org=()=>{const G=g=>S.board.filter(x=>x.g===g),nd=x=>`<div class="nd ${x.n?"":"vac"}" onclick="bd('${x.id}')"><div class="av">${x.n?esc(x.n.split(/[ -]/).map(w=>w[0]).slice(0,2).join("")):"?"}</div><b>${x.n?esc(x.n):"Vacant"}</b><small>${esc(x.r)}${x.d?" – "+esc(x.d):""}</small></div>`,pr=G("BE")[0];
return`<h1>Structura națională</h1><p class="sub">Selectează o poziție pentru profil, atribuire și istoric de mandat. Pozițiile vacante sunt marcate cu linie punctată.</p><div class="tree"><div style="display:flex;flex-direction:column;align-items:center">${nd(pr)}</div><div class="row">${G("BE").slice(1).map(nd).join("")}</div>
<div class="grp"><h2>Consiliul Director</h2><div class="row">${G("CD").map(nd).join("")}</div></div><div class="grp"><h2>Comisia de Monitorizare și Etică</h2><div class="row">${G("CME").map(nd).join("")}</div></div><div class="grp"><h2>Comisia de Cenzori</h2><div class="row">${G("CC").map(nd).join("")}</div></div></div>`};
function bd(id){const x=S.board.find(b=>b.id===id);modal(`<h2>${esc(x.r)}${x.d?" – "+esc(x.d):""}</h2><p>${x.n?"Titular: <b>"+esc(x.n)+"</b>":'<span class="tag Nouă">Poziție vacantă</span>'}</p><div class="f"><div class="w"><label>Persoană numită (gol = vacant)</label><input id="bn" value="${esc(x.n)}"></div></div><p><button onclick="svB('${id}')">Salvează mandatul</button> <button class="g" onclick="cm()">Închide</button></p><h2>Istoric mandate</h2>${x.h.map(m=>`<div>${esc(m.n)} · ${m.f} → ${m.t||"în curs"}</div>`).join("")||'<div class="empty">Fără mandate înregistrate.</div>'}`)}
function svB(id){const x=S.board.find(b=>b.id===id),n=$("#bn").value.trim();if(n!==x.n){const l=x.h[x.h.length-1];if(l&&!l.t)l.t=today();if(n)x.h.push({n,f:today(),t:""});log(`Mandat ${x.r}${x.d?" – "+x.d:""}: ${x.n||"vacant"} → ${n||"vacant"}`);x.n=n}save();cm();go()}
R.br=()=>`<h1>Filiale</h1><p class="sub">Nicio filială nu este preîncărcată. Adaugă filialele reale sau trimite o cerere de înființare.</p><div class="card" style="margin-bottom:14px"><h2>Cerere de înființare / filială nouă</h2><form onsubmit="svBr(event)"><div class="f"><div><label>Județ</label><input name="judet" list="jl" required></div><div><label>Localitate</label><input name="loc" required></div><div><label>Persoană inițiatoare</label><input name="init" required></div><div><label>Persoane implicate</label><input name="n" type="number" min="1"></div><div><label>Status</label><select name="s">${opts(BST,"Cerere de înființare")}</select></div><div class="w"><label>Structură propusă, motivare și plan de activitate</label><textarea name="plan" rows="3"></textarea></div></div><datalist id="jl">${JUD.map(j=>`<option>${j}`).join("")}</datalist><p><button>Înregistrează</button></p></form></div>
<div class="card tw">${S.br.length?`<table><tr><th>ID</th><th>Denumire</th><th>Județ</th><th>Inițiator</th><th>Voluntari</th><th>Status</th><th></th></tr>${S.br.map(b=>`<tr><td>${b.id}</td><td>${esc(b.name)}</td><td>${esc(b.judet)}</td><td>${esc(b.init)}</td><td>${S.vol.filter(v=>v.branch===b.name).length}</td><td>${tag(b.s)}</td><td><select onchange="stBr('${b.id}',this.value)">${opts(BST,b.s)}</select></td></tr>`).join("")}</table>`:'<div class="empty">Nicio filială înregistrată.</div>'}</div>`;
function svBr(e){const o=fd(e);o.id="FIL-"+String(++S.q.b).padStart(3,"0");o.name="Filiala "+o.judet;S.br.push(o);log(`Filială înregistrată: ${o.name} (${o.s})`);go()}
function stBr(id,s){const b=S.br.find(x=>x.id===id);log(`Filiala ${b.name}: ${b.s} → ${s}`);b.s=s;go()}
R.dep=()=>`<h1>Departamente</h1><p class="sub">Structura națională DNT. Conducerea provine din Biroul Executiv.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${DEPS.map(d=>{const h=S.board.find(b=>b.g==="BE"&&b.d===d);return`<div class="card"><h2>Departamentul ${d==="Resurse Umane"?"de ":d==="Secretariat"?"":"de "}${d}</h2><p>Conducere: ${h&&h.n?`<b>${esc(h.n)}</b> (${esc(h.r)})`:'<span class="tag Nouă">Vacant</span>'}</p><p style="color:var(--m)">Membri: ${S.vol.filter(v=>v.dept===d).length} · Ore validate: ${S.hrs.filter(x=>x.ok&&x.dept===d).reduce((s,x)=>s+x.h,0)}</p></div>`}).join("")}</div>`;
R.hrs=()=>`<h1>Ore de voluntariat</h1><p class="sub">Orele devin valide doar după aprobarea unui coordonator.</p><div class="card" style="margin-bottom:14px">${S.vol.length?`<form onsubmit="svH(event)"><div class="f"><div><label>Voluntar</label><select name="vid">${S.vol.map(v=>`<option value="${v.id}">${esc(v.nume)} ${esc(v.prenume)} (${v.id})</option>`).join("")}</select></div><div><label>Data</label><input name="d" type="date" value="${today()}" required></div><div><label>Proiect</label><input name="p" required></div><div><label>Număr ore</label><input name="h" type="number" step=".5" min=".5" required></div><div><label>Coordonator</label><input name="c" required></div><div class="w"><label>Descriere</label><input name="desc"></div></div><p><button>Înregistrează orele</button></p></form>`:'<div class="empty">Adaugă mai întâi un voluntar.</div>'}</div>
<div class="grid"><div class="card st"><b>${S.hrs.filter(h=>h.ok).reduce((s,h)=>s+h.h,0)}</b><span>Total național validat</span></div><div class="card st"><b>${S.hrs.filter(h=>h.ok&&h.d.slice(0,7)===today().slice(0,7)).reduce((s,h)=>s+h.h,0)}</b><span>Luna aceasta</span></div><div class="card st"><b>${S.hrs.filter(h=>h.ok&&h.d.slice(0,4)===today().slice(0,4)).reduce((s,h)=>s+h.h,0)}</b><span>Anul acesta</span></div></div>
<div class="card tw">${S.hrs.length?`<table><tr><th>Data</th><th>Voluntar</th><th>Proiect</th><th>Ore</th><th>Coordonator</th><th>Status</th><th></th></tr>${S.hrs.map((h,i)=>`<tr><td>${h.d}</td><td>${h.vid}</td><td>${esc(h.p)}</td><td>${h.h}</td><td>${esc(h.c)}</td><td>${tag(h.ok?"Validat":"Nevalidat")}</td><td>${h.ok?"":`<button class="s" onclick="okH(${i})">Aprobă</button>`}</td></tr>`).join("")}</table>`:'<div class="empty">Nicio înregistrare.</div>'}</div>`;
function svH(e){const o=fd(e),v=S.vol.find(x=>x.id===o.vid);S.hrs.unshift({vid:o.vid,d:o.d,p:o.p,h:+o.h,c:o.c,desc:o.desc,br:v.branch,dept:v.dept,ok:false});log(`Ore înregistrate: ${o.h} h pentru ${o.vid}`);go()}
function okH(i){const h=S.hrs[i];h.ok=true;const v=S.vol.find(x=>x.id===h.vid);v&&v.h.push({d:today(),t:`${h.h} ore validate — ${h.p}`});log(`Ore validate: ${h.h} h pentru ${h.vid}`);go()}
R.aud=()=>`<h1>Audit log</h1><p class="sub">Registru doar cu adăugare: acțiunile nu pot fi modificate sau șterse din interfață.</p><div class="card tw">${S.aud.length?`<table><tr><th>Data și ora</th><th>Utilizator</th><th>Acțiune</th></tr>${S.aud.map(a=>`<tr><td>${new Date(a.t).toLocaleString("ro-RO")}</td><td>${a.u}</td><td>${esc(a.a)}</td></tr>`).join("")}</table>`:'<div class="empty">Nicio acțiune înregistrată.</div>'}</div>`;
const gate=h=>`<div style="margin:auto;max-width:400px;padding:24px;width:100%">${h}</div>`;
const authUI=m=>gate(`<div class="logo"><img src="${LOGO}" alt="DNT"></div><h1 style="margin-top:14px">DNT Volunteer Hub</h1><div class="card"><form onsubmit="auth(event,'${m}')"><div class="f" style="grid-template-columns:1fr">${m==="up"?'<div><label>Nume</label><input name="nume" required></div><div><label>Prenume</label><input name="prenume" required></div>':""}<div><label>E-mail</label><input name="email" type="email" required></div><div><label>Parolă</label><input name="pw" type="password" minlength="8" required></div></div><p><button>${m==="up"?"Creează cont":"Autentificare"}</button></p><p id="msg" style="color:var(--wr)"></p></form><a href="#" onclick="$('#app').innerHTML=authUI('${m==="up"?"in":"up"}');return false" style="color:var(--a2)">${m==="up"?"Am deja cont":"Nu am cont – înregistrare"}</a>${SB_URL?"":`<hr style="border:0;border-top:1px solid var(--b);margin:14px 0"><p style="color:var(--wr)">Supabase nu este conectat încă (completează SB_URL și SB_KEY). Până atunci poți testa interfața:</p><p><button type="button" class="g" onclick="demo('admin')">Demo: board</button> <button type="button" class="g" onclick="demo('voluntar')">Demo: voluntar</button></p>`}</div>`);
async function auth(e,m){if(!sb){if(!SB_URL||!SB_KEY){$("#msg").textContent="Supabase nu este configurat (SB_URL / SB_KEY).";return}sb=supabase.createClient(SB_URL,SB_KEY)}const o=fd(e),r=m==="up"?await sb.auth.signUp({email:o.email,password:o.pw,options:{data:{nume:o.nume,prenume:o.prenume}}}):await sb.auth.signInWithPassword({email:o.email,password:o.pw});
if(r.error){$("#msg").textContent=r.error.message;return}if(m==="up"&&!r.data.session){$("#msg").textContent="Cont creat. Confirmă e-mailul, apoi un membru al board-ului îți aprobă accesul.";return}boot()}
function demo(r){ME={id:"demo",nume:"Demo",prenume:r,email:"demo@local",role:r,status:"activ"};$("#app").innerHTML='<nav id="nav"></nav><main id="main"></main>';go()}
async function out(){if(sb)await sb.auth.signOut();ME=null;boot()}
async function boot(){if(!SB_URL||!SB_KEY){$("#app").innerHTML=authUI("in");return}
sb=sb||supabase.createClient(SB_URL,SB_KEY);const{data:{session}}=await sb.auth.getSession();if(!session){$("#app").innerHTML=authUI("in");return}
const{data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).single();ME=p;
if(!p||p.status!=="activ"){const st=p&&p.status==="suspendat"?"Contul este suspendat.":"Contul tău așteaptă aprobarea board-ului.";ME=null;$("#app").innerHTML=gate(`<div class="card"><h2>Acces restricționat</h2><p>${st}</p><button class="g" onclick="out()">Ieșire</button></div>`);return}
$("#app").innerHTML='<nav id="nav"></nav><main id="main"></main>';go()}
R.me=()=>`<h1>Contul meu</h1><p class="sub">Acces de voluntar.</p><div class="card"><p><b>${esc(ME.nume)} ${esc(ME.prenume)}</b><br>${esc(ME.email)}<br>Rol: ${ME.role} · Status: ${ME.status}</p></div><p class="sub" style="margin-top:14px">Ai acces la contul tău și la orele tale de voluntariat. Documentele, filialele, rapoartele și datele altor voluntari sunt accesibile doar board-ului.</p>`;
R.users=()=>{loadU();return'<h1>Conturi și acces</h1><p class="sub">Aprobă conturile noi și setează rolul. Un cont nou rămâne blocat până îl activezi.</p><div class="card tw" id="ut">Se încarcă…</div>'};
async function loadU(){if(!sb){$("#ut").textContent="Indisponibil în modul demonstrativ.";return}const{data,error}=await sb.from("profiles").select("*").order("created_at",{ascending:false});if(error){$("#ut").textContent=error.message;return}
const so=(id,f,a,v)=>`<select onchange="updU('${id}','${f}',this.value)">${a.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}</select>`;
$("#ut").innerHTML=`<table><tr><th>Nume</th><th>E-mail</th><th>Rol</th><th>Status</th></tr>${data.map(u=>`<tr><td>${esc(u.nume)} ${esc(u.prenume)}</td><td>${esc(u.email)}</td><td>${so(u.id,"role",ROLES,u.role)}</td><td>${so(u.id,"status",["in_asteptare","activ","suspendat"],u.status)}</td></tr>`).join("")}</table>`}
async function updU(id,f,v){const{error}=await sb.from("profiles").update({[f]:v}).eq("id",id);if(error)alert(error.message);else await sb.from("audit_logs").insert({actiune:`Cont ${id}: ${f} → ${v}`});loadU()}
let DH=[];const live=()=>sb&&ME.id!=="demo";
R.oreme=()=>{loadH();return`<h1>Orele mele</h1><p class="sub">Înregistrează orele de voluntariat. Un membru al board-ului le validează.</p><div class="card" style="margin-bottom:14px"><form onsubmit="svMy(event)"><div class="f"><div><label>Data</label><input name="d" type="date" value="${today()}" required></div><div><label>Proiect</label><input name="p" required></div><div><label>Număr ore</label><input name="h" type="number" step=".5" min=".5" required></div><div><label>Coordonator</label><input name="c" required></div></div><p><button>Înregistrează orele</button></p></form></div><div id="mh"></div>`};
async function loadH(){let L;if(live()){const{data,error}=await sb.from("volunteer_hours").select("*").eq("user_id",ME.id).order("data",{ascending:false});if(error){$("#mh").textContent=error.message;return}L=data}else L=DH;
const sum=f=>L.filter(f).reduce((t,x)=>t+Number(x.ore),0),y=today().slice(0,4);
$("#mh").innerHTML=`<div class="grid"><div class="card st"><b>${sum(x=>x.validat)}</b><span>Ore validate</span></div><div class="card st"><b>${sum(x=>!x.validat)}</b><span>În așteptare</span></div><div class="card st"><b>${sum(x=>x.validat&&x.data.slice(0,4)===y)}</b><span>Validate anul acesta</span></div></div><div class="card tw">${L.length?`<table><tr><th>Data</th><th>Proiect</th><th>Ore</th><th>Coordonator</th><th>Status</th></tr>${L.map(x=>`<tr><td>${x.data}</td><td>${esc(x.proiect)}</td><td>${x.ore}</td><td>${esc(x.coordonator)}</td><td>${tag(x.validat?"Validat":"Nevalidat")}</td></tr>`).join("")}</table>`:'<div class="empty">Nicio înregistrare încă. Adaugă prima activitate.</div>'}</div>`}
async function svMy(e){const o=fd(e),f=e.target;if(live()){const{error}=await sb.from("volunteer_hours").insert({user_id:ME.id,data:o.d,proiect:o.p,ore:+o.h,coordonator:o.c});if(error){alert(error.message);return}}else DH.unshift({data:o.d,proiect:o.p,ore:+o.h,coordonator:o.c,validat:false});f.reset();loadH()}
R.orevol=()=>{loadV();return'<h1>Ore trimise de voluntari</h1><p class="sub">Validează orele înregistrate de voluntari.</p><div class="card tw" id="ov">Se încarcă…</div>'};
async function loadV(){if(!live()){$("#ov").textContent="Indisponibil în modul demonstrativ.";return}const{data,error}=await sb.from("volunteer_hours").select("*,profiles(nume,prenume)").order("created_at",{ascending:false});if(error){$("#ov").textContent=error.message;return}
$("#ov").innerHTML=data.length?`<table><tr><th>Voluntar</th><th>Data</th><th>Proiect</th><th>Ore</th><th>Coordonator</th><th>Status</th><th></th></tr>${data.map(x=>`<tr><td>${esc(x.profiles?.nume)} ${esc(x.profiles?.prenume)}</td><td>${x.data}</td><td>${esc(x.proiect)}</td><td>${x.ore}</td><td>${esc(x.coordonator)}</td><td>${tag(x.validat?"Validat":"Nevalidat")}</td><td>${x.validat?"":`<button class="s" onclick="okV('${x.id}')">Validează</button>`}</td></tr>`).join("")}</table>`:'<div class="empty">Niciun voluntar nu a trimis ore.</div>'}
async function okV(id){const{error}=await sb.from("volunteer_hours").update({validat:true}).eq("id",id);if(error)alert(error.message);else await sb.from("audit_logs").insert({actiune:"Ore validate "+id});loadV()}
let DT=[];const SL={deschis:"Deschis",in_lucru:"În lucru",finalizat:"Finalizat"};
const dleft=t=>Math.round((new Date(t.termen)-new Date(today()))/864e5);
const tinfo=t=>{if(t.status==="finalizat")return tag("Finalizat");const d=dleft(t);return d<0?`<span class="tag Suspendat">Întârziat ${-d} zile</span>`:d<=2?`<span class="tag Nouă">${d===0?"Termen astăzi":d+" zile rămase"}</span>`:`<span class="tag">${d} zile rămase</span>`};
async function getT(own){if(live()){let q=sb.from("tasks").select(own?"*":"*,profiles(nume,prenume)").order("termen");if(own)q=q.eq("asignat_id",ME.id);const{data,error}=await q;if(error)throw error;return data}return own?DT.filter(t=>t.asignat_id===ME.id):DT}
async function loadT(own){const el=$("#tl");let L;try{L=await getT(own)}catch(e){el.textContent=e.message;return}
const c=k=>L.filter(t=>t.status===k).length,late=L.filter(t=>t.status!=="finalizat"&&dleft(t)<0).length;
el.innerHTML=`<div class="grid"><div class="card st"><b>${c("deschis")}</b><span>Deschise</span></div><div class="card st"><b>${c("in_lucru")}</b><span>În lucru</span></div><div class="card st"><b>${c("finalizat")}</b><span>Finalizate</span></div><div class="card st"><b>${late}</b><span>Întârziate</span></div></div><div class="card tw">${L.length?`<table><tr><th>Task</th>${own?"":"<th>Voluntar</th>"}<th>Termen</th><th>Timp</th><th>Status</th><th></th></tr>${L.map(t=>`<tr><td><b>${esc(t.titlu)}</b><br><small style="color:var(--m)">${esc(t.descriere)}</small></td>${own?"":`<td>${esc(t.profiles?t.profiles.nume+" "+t.profiles.prenume:"Demo")}</td>`}<td>${t.termen}</td><td>${tinfo(t)}</td><td>${tag(SL[t.status])}</td><td>${own?(t.status==="deschis"?`<button class="s g" onclick="setT('${t.id}','in_lucru',1)">Începe</button> `:"")+(t.status!=="finalizat"?`<button class="s" onclick="setT('${t.id}','finalizat',1)">Finalizează</button>`:""):`${t.status==="finalizat"?`<button class="s g" onclick="setT('${t.id}','in_lucru',0)">Redeschide</button> `:""}<button class="s d" onclick="delT('${t.id}')">Șterge</button>`}</td></tr>`).join("")}</table>`:`<div class="empty">${own?"Nu ai task-uri atribuite.":"Niciun task creat încă."}</div>`}</div>`}
async function setT(id,st,own){if(live()){const{error}=await sb.rpc("set_task_status",{tid:id,st});if(error){alert(error.message);return}}else{const t=DT.find(x=>x.id===id);t.status=st}loadT(!!own)}
async function delT(id){if(!confirm("Ștergi acest task?"))return;if(live()){const{error}=await sb.from("tasks").delete().eq("id",id);if(error){alert(error.message);return}}else DT=DT.filter(x=>x.id!==id);loadT(false)}
R.taskme=()=>{loadT(true);return'<h1>Task-urile mele</h1><p class="sub">Sarcini primite de la board, cu termen limită. Finalizează-le înainte de termen.</p><div id="tl"></div>'};
R.taskuri=()=>{loadAs();loadT(false);return`<h1>Taskuri pentru voluntari</h1><p class="sub">Atribuie sarcini cu termen limită și urmărește stadiul lor.</p><div class="card" style="margin-bottom:14px"><form onsubmit="svT(event)"><div class="f"><div><label>Voluntar</label><select name="a" id="as" required><option value="">Se încarcă…</option></select></div><div><label>Termen limită</label><input name="t" type="date" min="${today()}" required></div><div class="w"><label>Titlu</label><input name="ti" required></div><div class="w"><label>Descriere</label><textarea name="d" rows="2"></textarea></div></div><p><button>Atribuie task</button></p></form></div><div id="tl"></div>`};
async function loadAs(){let L=[{id:"demo",nume:"Voluntar",prenume:"Demo"}];if(live()){const{data}=await sb.from("profiles").select("id,nume,prenume").eq("status","activ").order("nume");L=data||[]}
$("#as").innerHTML='<option value="">Alege…</option>'+L.map(p=>`<option value="${p.id}">${esc(p.nume)} ${esc(p.prenume)}</option>`).join("")}
async function svT(e){const o=fd(e),f=e.target;if(live()){const{error}=await sb.from("tasks").insert({titlu:o.ti,descriere:o.d,termen:o.t,asignat_id:o.a,status:"deschis"});if(error){alert(error.message);return}}else DT.push({id:"t"+Date.now(),titlu:o.ti,descriere:o.d,termen:o.t,asignat_id:o.a,status:"deschis"});f.reset();loadT(false)}
addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card,.nd");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--x",e.clientX-r.left+"px");c.style.setProperty("--y",e.clientY-r.top+"px")}});
boot();
</script></body></html>
